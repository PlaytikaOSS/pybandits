# This is a workflow for continuous integration (CI)

name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13" , "3.14" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: |
          if [ "${{ matrix.python-version }}" == "3.9" ]; then
            curl -sSL https://install.python-poetry.org | python3 - --version 2.2.1
          else
            curl -sSL https://install.python-poetry.org | python3 -
          fi
          export PATH="$HOME/.poetry/bin:$PATH"
      - name: Install project dependencies with Poetry
        run: |
          poetry install --all-extras
      - name: Style check
        run: |
          # run pre-commit hooks
          poetry run pre-commit run --all-files
      - name: Run tests without coverage
        if: ${{ matrix.python-version != '3.10' }}
        run: |
          poetry run pytest -n auto -vv --durations=5
      - name: Run tests with coverage
        if: ${{ matrix.python-version == '3.10' }}
        run: |
          poetry run pytest -n auto -vv --durations=5 --cov=pybandits/ --cov-report=xml --cov-report=html --cov-config=.coveragerc
      - name: Upload coverage HTML report as artifact
        if: ${{ matrix.python-version == '3.10' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 30
