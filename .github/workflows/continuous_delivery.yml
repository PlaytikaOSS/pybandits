name: CD

on:
  push:
    branches:
      - main

jobs:
  check_version_and_publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.9", "3.10", "3.11", "3.12" ]
        pydantic-version: [ "1.10.*", "2.*" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          export PATH="$HOME/.poetry/bin:$PATH"
      - name: Backup pyproject.toml
        run: cp pyproject.toml pyproject.toml.bak
      - name: Change pydantic version
        run: |
          poetry add pydantic@${{ matrix.pydantic-version }} --lock
      - name: Cache Poetry virtualenv and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.local/share/pypoetry/virtualenvs
          key: ${{ runner.os }}-poetry-${{ matrix.python-version }}-${{ matrix.pydantic-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-${{ matrix.python-version }}-${{ matrix.pydantic-version }}-
      - name: Install project dependencies with Poetry
        run: |
          poetry install
      - name: Restore pyproject.toml
        run: |
          mv pyproject.toml.bak pyproject.toml
      - name: Style check
        run: |
          # run pre-commit hooks
          poetry run pre-commit run --all-files
      - name: Run tests without coverage
        if: ${{ matrix.python-version != '3.10' }}
        run: |
          poetry run pytest -n auto -vv --durations=5
      - name: Run tests with coverage
        if: ${{ matrix.python-version == '3.10' }}
        run: |
          poetry run pytest -n auto -vv --durations=5 --cov=pybandits/ --cov-report=xml --cov-report=html
      - name: Upload coverage to Codecov
        if: ${{ matrix.python-version == '3.10' }}
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: py${{ matrix.python-version }}-pydantic${{ matrix.pydantic-version == '1.10.*' && 'v1' || 'v2' }}
          name: coverage-report-py${{ matrix.python-version }}-pydantic${{ matrix.pydantic-version == '1.10.*' && 'v1' || 'v2' }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Extract version from pyproject.toml
        id: extract_version
        run: |
          VERSION=v$(poetry version -s)
          echo "PACKAGE_VERSION=${VERSION}" >> $GITHUB_ENV
          REMOTE_VERSION=$(git ls-remote --tags origin "refs/tags/${VERSION}" 2>/dev/null)
          LOCAL_VERSION=$(git tag -l "${VERSION}" 2>/dev/null)
          if [ -n "$REMOTE_VERSION" ] || [ -n "$LOCAL_VERSION" ]; then
            echo "Version ${VERSION} already exists."
            echo "VERSION_CHANGED=false" >> $GITHUB_ENV
          else
            echo "VERSION_CHANGED=true" >> $GITHUB_ENV
          fi
      - name: Create a Git tag
        if: ${{ env.VERSION_CHANGED == 'true' && matrix.python-version == '3.8' && matrix.pydantic-version == '2.*' }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          git tag "${{ env.PACKAGE_VERSION }}"
          git push origin "${{ env.PACKAGE_VERSION }}"
      - name: Publish Draft Release
        if: ${{ env.VERSION_CHANGED == 'true' && matrix.python-version == '3.10' && matrix.pydantic-version == '2.*' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const draftRelease = releases.find(r => r.draft && r.name === 'Draft');

            if (draftRelease) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: draftRelease.id,
                tag_name: process.env.PACKAGE_VERSION,
                name: process.env.PACKAGE_VERSION,
                draft: false
              });
            } else {
              core.setFailed(`Draft release named "Draft" not found.`);
            };
      - name: Build and publish to pypi
        if: ${{ env.VERSION_CHANGED == 'true' && matrix.python-version == '3.10' && matrix.pydantic-version == '2.*' }}
        run: |
          poetry config pypi-token.pypi ${{ secrets.PYPI_TOKEN }}
          poetry publish --build
